<mat-toolbar class="topbar">


  <button mat-icon-button aria-label="Notifications" (click)="toggle()">
     <span id="site-name">
      <label for="menu_active">
        <i *ngIf='showToggleIcon' class="fa fa-bars"></i>
        <i *ngIf='!showToggleIcon' class="fa fa-arrow-left"></i>
      </label>
    </span>
  </button>

  <span class="flex-1-auto"></span>


  <button mat-icon-button [matMenuTriggerFor]="profilemenu" aria-label="Notifications" (click)="toggle()">
    <img src="/assets/images/profile/user-1.jpg" class="rounded-circle object-cover" width="35" />
  </button>
  <mat-menu #profilemenu="matMenu" class="topbar-dd cardWithShadow">


    <div class="p-x-12 m-t-12">
      <button mat-stroked-button color="primary" class="w-100" (click)="logout()">
        Logout
      </button>
    </div>

  </mat-menu>
</mat-toolbar>
