<mat-sidenav-container
  class="mainWrapper blue_theme  light-theme"
  autosize
  autoFocus
  dir="ltr"
  style="display: flex;"
>

  <mat-sidenav
    #leftsidenav
    [mode]="isOver ? 'over' : 'side'"
    [opened]="!isOver"
    style="position: relative;"


  >
    <app-sidebar></app-sidebar>
  </mat-sidenav>

  <mat-sidenav-content class="contentWrappe m-0 w-100" style="max-width: 100%;">


    <app-header
    [showToggle]="!isOver"

  ></app-header>

    <main class="pageWrapper mb-0 py-2 w-100" style="max-width: 100%;">


      <router-outlet></router-outlet>
    </main>
  </mat-sidenav-content>
</mat-sidenav-container>
