<h1 class="fs-4 fw-bold mb-3">Dashboard</h1>
<div class="dashboard-container card p-3 col-12 col-md-8">
  <!-- Search Bar -->
  <!-- <div class="search-container">
    <mat-form-field appearance="outline" class="search-field">
      <mat-label>Search by Material Name or Material Group</mat-label>
      <span class="input-group-addon">
        <i class="fa-solid fa-magnifying-glass"></i>
      </span>
      <input matInput (keyup)="applyFilter($event)" placeholder="Search"/>
    </mat-form-field>
  </div> -->
  <div class="d-flex justify-content-between align-items-center">
  <div class="">
    <b class="fs-5">Current Stock</b>
  </div>

  <div id="" class=" d-flex justify-content-end mb-2">
    <div class="dt-search">
      <label for="dt-search-0"
        ><div class="input-group">
          <span class="input-group-addon"
            ><span class="fa fa-search"></span></span
          ><input
          (keyup)="applyFilter($event)"
            type="search"
            class="dt-input"
            id="dt-search-0"
            placeholder="Search..."
            aria-controls="users-table"
          /></div
      ></label>
    </div>
  </div>
</div>

  <!-- Table for Material Data -->
  <div class="table-container">
    <table mat-table [dataSource]="dataSource" matSort class="table-striped table-bordered">
      <!-- Material Group Column -->
      <ng-container matColumnDef="materialgroup">
        <th mat-header-cell *matHeaderCellDef mat-sort-header class="heading">
          Material Group
        </th>
        <td mat-cell *matCellDef="let element">{{ element.group_name }}</td>
      </ng-container>

      <!-- Material Name Column -->
      <ng-container matColumnDef="materialname">
        <th mat-header-cell *matHeaderCellDef mat-sort-header class="heading">Material Name</th>
        <td mat-cell *matCellDef="let element">{{ element.material_name }}</td>
      </ng-container>

      <!-- Material Unit Column -->
      <ng-container matColumnDef="material_unit">
        <th mat-header-cell *matHeaderCellDef mat-sort-header class="heading">UOM</th>
        <td mat-cell *matCellDef="let element">{{ element.material_unit }}</td>
      </ng-container>

      <!-- Quantity Column -->
      <ng-container matColumnDef="quantity">
        <th mat-header-cell *matHeaderCellDef mat-sort-header class="heading">Quantity</th>
        <td mat-cell *matCellDef="let element" class="text-end">{{ element.avaqty }}</td>
      </ng-container>

      <!-- Table Header -->
      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>

      <!-- Table Row -->
      <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
    </table>
  </div>

  <!-- Pagination -->
  <div class="pagination-container">
    <mat-paginator
      [length]="dataSource?.data?.length"
      [pageSize]="5"
      [pageSizeOptions]="[5, 10, 25, 50]"
    >
    </mat-paginator>
  </div>
</div>
