<div class="d-flex flex-column flex-md-row container-fluid gap-2">
    <div class="col-md-2 col-xl-2 col-sm-12 col-12 bg-body card pe-0">
        <form [formGroup]="materialGroup" (ngSubmit)="materialSave()" class="p-3">
            <div class="align-items-center">
                <div class="col-md-12 col-sm-12 col-12 px-0">
                    <div class="form-box">
                        <label class="form-check-label mb-2">Material Group</label>
                        <input type="text" id="group_name" name="group_name" class="form-control px-0"
                            formControlName="group_name" placeholder=" Enter Material Group">
                    </div>
                </div>

                <div class="d-flex">
                    <div class="submit-btn pt-4" *ngIf="!isUpdating">
                        <button type="submit" class="btn btn-primary">Submit</button>
                    </div>

                    <div class="submit-btn pt-4" *ngIf="isUpdating">
                        <button type="button" class="btn btn-primary" (click)="onUpdate()">Update</button>
                    </div>

                    <div class="submit-btn pt-4 ms-2">
                        <button type="button" class="btn btn-primary" (click)="resetForm()">Reset</button>
                    </div>
                </div>
            </div>
        </form>
    </div>
    <div class="col-md-10 col-xl-10 col-sm-12 col-12 bg-body card ps-0">

        <div class="tablewrapper p-3">
            <table class="table  table-responsive">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Material Group</th>
                        <th>Created At</th>
                        <th>Action</th>
                    </tr>
                </thead>
                <tbody *ngFor="let item of paginatedData">
                    <tr>
                        <td (click)="updateMaterial(item)"
                            style="color: blue; font-weight: 600; cursor: pointer;">{{item.id}}</td>
                        <td>{{item.group_name}}</td>
                        <td>{{item.created_at}}</td>
                        <td style="cursor: pointer; color: red; font-weight: 600;" (click)="deleteMaterial(item.id)">
                            Delete</td>
                    </tr>
                </tbody>
            </table>


            <div class="pagination-controls">
              <button class="btn btn-secondary" (click)="previousPage()" [disabled]="currentPage === 1">Previous</button>
              <span class="mx-3">Page {{ currentPage }} of {{ totalPage }}</span>
              <button class="btn btn-secondary" (click)="nextPage()" [disabled]="currentPage >= totalPage">Next</button>
            </div>




            <!-- <div class="text-center py-2"> No Items Found </div> -->
        </div>
    </div>
</div>
