<h1 class="fs-4 fw-bold mb-3">Material Group</h1>
<div class="d-flex flex-column flex-md-row container-fluid gap-3 ps-0">
  <div class="col-md-2 col-xl-2 col-sm-12 col-12 bg-body card p-0">
    <form [formGroup]="materialGroup" (ngSubmit)="materialSave()" class="p-3">
      <div class="align-items-center">
        <div class="col-md-12 col-sm-12 col-12 px-0">
          <div class="form-box">
            <label class="form-check-label mb-2 fw-bold fs-5">Add Material Group</label>
            <input
              type="text"
              id="group_name"
              name="group_name"
              class="form-control px-0 ps-2"
              formControlName="group_name"
              placeholder="Enter Material Group"
            />
            <div *ngIf="materialGroup.get('group_name')?.invalid && materialGroup.get('group_name')?.touched">
              <small class="text-danger">Group Name is required</small>
            </div>
          </div>
        </div>

        <div class="d-flex">
          <div class="submit-btn pt-4" *ngIf="!isUpdating">
            <button type="submit" class="btn btn-primary ch_button">Submit</button>
          </div>

          <div class="submit-btn pt-4" *ngIf="isUpdating">
            <button type="button" class="btn btn-primary ch_button" (click)="onUpdate()">
              Update
            </button>
          </div>

          <div class="submit-btn pt-4 ms-2">
            <button type="button" class="btn btn-primary ch_button" (click)="resetForm()">
              Reset
            </button>
          </div>
        </div>
      </div>
    </form>
  </div>

  <div class="col-md-10 col-xl-10 col-sm-12 col-12 bg-body card ">
    <div class="d-flex justify-content-between align-items-center px-md-3 pt-3">
      <div><b class="fs-md-5 table-heading">Material Group List</b></div>
      <div id="" class="d-flex justify-content-end mb-md-2">
        <div class="dt-search">
          <label for="dt-search-0"
            ><div class="input-group">
              <span class="input-group-addon"
                ><span class="fa fa-search" aria-hidden="true"></span></span
              ><input
                type="search"
                (keyup)="applyFilter($event)"
                id="dt-search-0"
                placeholder="Search..."
                aria-controls="users-table"
                class="dt-input"
              /></div
          ></label>
        </div>
      </div>
    </div>

    <div class="tablewrapper pt-3 pt-md-0 p-md-3 table-container table-responsive">
      <table mat-table [dataSource]="dataSource" matSort class="table-bordered">
        <ng-container matColumnDef="sno">
          <th mat-header-cell *matHeaderCellDef  class="heading">S.No</th>
          <td
            mat-cell
            *matCellDef="let item; let i = index"
            style="color: blue; font-weight: 600; cursor: pointer"
          >
            {{ i + 1 }}
          </td>
        </ng-container>

        <ng-container matColumnDef="group_name">
          <th mat-header-cell *matHeaderCellDef mat-sort-header class="heading">
            Material Group
          </th>
          <td mat-cell *matCellDef="let item">{{ item.group_name }}</td>
        </ng-container>

        <ng-container matColumnDef="created_at">
          <th mat-header-cell *matHeaderCellDef mat-sort-header class="heading">Created At</th>
          <td mat-cell *matCellDef="let item">{{ item.created_at | date: "dd-MM-yyyy" }}</td>
        </ng-container>

        <ng-container matColumnDef="actions">
          <th mat-header-cell *matHeaderCellDef class="heading">Action</th>
          <td
            mat-cell
            *matCellDef="let item"
            style="cursor: pointer; font-weight: 600"
            class="text-danger d-flex gap-3"
          >
            <i class="fa-solid fa-trash" (click)="onDelete(item.id)"></i>
            <i
              class="fa-solid fa-pencil-alt text-success"
              (click)="updateMaterial(item)"
            ></i>
          </td>

        </ng-container>

        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>

        <tr class="mat-row" *matNoDataRow>
          <td class="mat-cell text-center font-weight-bold" colspan="4">No data found</td>
        </tr>
      </table>

    </div>
    <div class="pagination-container">
      <mat-paginator
        [length]="dataSource?.data?.length"
        [pageSize]="10"
        [pageSizeOptions]="[5, 10, 25, 50]"
      >
      </mat-paginator>
    </div>
  </div>


</div>
