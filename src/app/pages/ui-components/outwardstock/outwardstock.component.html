        <div class="col-md-10 col-xl-10 col-sm-12 col-12 bg-body card ps-0">
            <div class="d-flex justify-content-between align-items-center px-3 pt-3">
              <div><b class="fs-6 fs-md-5">Outward List</b></div>
              <div id="" class="d-flex justify-content-end mb-md-2">
                <div class="dt-search">
                  <label for="dt-search-0"
                    ><div class="input-group">
                      <span class="input-group-addon"
                        ><span class="fa fa-search" aria-hidden="true"></span></span
                      ><input
                        type="search"
                        (keyup)="applyFilter($event)"
                        id="dt-search-0"
                        placeholder="Search..."
                        aria-controls="users-table"
                        class="dt-input"
                      /></div
                  ></label>
                </div>
              </div>
            </div>
            <!-- <div class="d-flex justify-content-between p-3">
              <input matInput [(ngModel)]="searchTerm" (ngModelChange)="applyFilter()" placeholder="Search by Material Group" class="form-control" />
            </div> -->
            <div class="tablewrapper p-3 table-container table-responsive">
              <table mat-table [dataSource]="dataSource" matSort class="table-bordered">
                <ng-container matColumnDef="sno">
                  <th mat-header-cell *matHeaderCellDef mat-sort-header class="heading">S.No</th>
                  <td
                    mat-cell
                    *matCellDef="let item; let i = index"
                    (click)="updateOutward(item)"
                    style="color: blue; font-weight: 600; cursor: pointer"
                  >
                    {{ i + 1 }}
                  </td>
                </ng-container>

                <ng-container matColumnDef="group_name">
                  <th mat-header-cell *matHeaderCellDef mat-sort-header class="heading">
                    Material Group
                  </th>
                  <td mat-cell *matCellDef="let item">{{ item.group_name }}</td>
                </ng-container>
                <ng-container matColumnDef="material_name">
                  <th mat-header-cell *matHeaderCellDef mat-sort-header class="heading">
                    Material Name
                  </th>
                  <td mat-cell *matCellDef="let item">{{ item.material_name }}</td>
                </ng-container>
                <ng-container matColumnDef="qty">
                  <th mat-header-cell *matHeaderCellDef mat-sort-header class="heading">
                    Quantity
                  </th>
                  <td mat-cell *matCellDef="let item">{{ item.qty }}</td>
                </ng-container>
                <ng-container matColumnDef="material_unit">
                  <th mat-header-cell *matHeaderCellDef mat-sort-header class="heading">
                    UOM
                  </th>
                  <td mat-cell *matCellDef="let item">{{ item.material_unit }}</td>
                </ng-container>
                <ng-container matColumnDef="transition_date">
                  <th mat-header-cell *matHeaderCellDef mat-sort-header class="heading">
                    Transaction Date
                  </th>
                  <td mat-cell *matCellDef="let item">{{ item.transition_date }}</td>
                </ng-container>

                <ng-container matColumnDef="outward_orders">
                  <th mat-header-cell *matHeaderCellDef mat-sort-header class="heading">
                     No. of Order procceed
                  </th>
                  <td mat-cell *matCellDef="let item">{{ item.outward_orders }}</td>
                </ng-container>

                <ng-container matColumnDef="outward_date">
                  <th mat-header-cell *matHeaderCellDef mat-sort-header class="heading">
                    Outward Date
                  </th>
                  <td mat-cell *matCellDef="let item">{{ item.outward_date }}</td>
                </ng-container>



                <ng-container matColumnDef="actions">
                  <th mat-header-cell *matHeaderCellDef class="heading">Action</th>
                  <td
                    mat-cell
                    *matCellDef="let item"
                    style="cursor: pointer; font-weight: 600"
                    class="text-danger d-flex gap-3"
                  >
                    <i class="fa-solid fa-trash" (click)="deleteOutward(item)"></i>
                    <i
                      class="fa-solid fa-pencil-alt text-success"
                      (click)="updateOutward(item)"
                    ></i>
                  </td>
                  <!-- <td mat-cell *matCellDef="let item" style="cursor: pointer; font-weight: 600;" class="text-success" (click)="updateMaterial(item)">
                    <i class="fa-solid fa-pencil-alt"></i>
                  </td> -->
                </ng-container>

                <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
                <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
              </table>

              <mat-paginator
                [pageSize]="pageSize"
                [pageIndex]="currentPage - 1"
                [length]="totalItems"
                (page)="onPageChange($event)"
                [pageSizeOptions]="[5, 10, 25, 50]"
                aria-label="Select page"
              >
              </mat-paginator>
            </div>
          </div>





  </div>
</div>
