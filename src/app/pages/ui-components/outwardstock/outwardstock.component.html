<div class="d-flex flex-column flex-md-row container-fluid">
    <div class="col-md-6 col-xl-6 col-sm-12 col-12 pe-md-4 shadow-sm p-3 mb-5 bg-body rounded">
        <form [formGroup]="outwardForm">
            <div class="align-items-center">
                <div class="row">
                  <div class="col-xl-6 col-md-6 col-sm-12 col-12">
                    <div class="form-box">
                      <label class="form-check-label mb-2">Material Group</label>
                      <select
                        id="materialgroup"
                        name="materialgroup"
                        class="form-select"
                        formControlName="materialgroup"
                        (change)="getMaterial($event)"
                        >
                        <option value="">Select Material Group</option>

                        <option *ngFor="let group of materialGroups" [value]="group.id">
                          {{ group.group_name }}
                        </option>
                      </select>
                    </div>
                  </div>



                  <div class="col-xl-6 col-md-6 col-sm-12 col-12">
                    <div class="form-box">
                      <label class="form-check-label mb-2">Material Name</label>
                      <select
                        id="materialname"
                        name="materialname"
                        class="form-select"
                        formControlName="materialname"

                      >
                        <option value="">Select Material</option>

                        <option *ngFor="let group of material" [value]="group.id">
                          {{ group.material_name }}
                        </option>
                      </select>
                    </div>
                  </div>
                    <div class="col-xl-6 col-lg-6 col-md-6 col-sm-12 col-12 mt-1">
                        <div class="form-box">
                            <label class="form-check-label mb-2">Transaction Date</label>
                            <input type="date" id="transdate" name="transdate" class="form-control px-0"
                                formControlName="transdate">
                        </div>
                    </div>
                    <div class="col-xl-6 col-lg-6 col-md-6 col-sm-12 col-12 mt-1">
                        <div class="form-box">
                            <label class="form-check-label mb-2">Quantity</label>
                            <input type="text" id="quantity" name="quantity" class="form-control px-0"
                                formControlName="quantity" placeholder=" Enter Quantity">
                        </div>
                    </div>
                    <div class="col-xl-6 col-lg-6 col-md-6 col-sm-12 col-12 mt-1"></div>
                    <div class="form-box">
                        <label class="form-check-label mb-2">No. of order processed</label>
                        <input type="text" id="nooforders" name="nooforders" class="form-control px-0"
                            formControlName="nooforders" placeholder="Order Processed">
                    </div>
                </div>
            </div>

            <div class="submit-btn pt-3" *ngIf="!isUpdating">
                <button type="submit" class="btn btn-primary" (click)="outwardSubmit()">Submit</button>
            </div>

            <div class="submit-btn pt-4" *ngIf="isUpdating">
              <button type="button" class="btn btn-primary" (click)="onUpdate()">Update</button>
          </div>

        </form>
    </div>




    <div class="col-md-6 col-xl-6 col-sm-12 col-12 shadow-sm p-3 mb-5 bg-body rounded">


    <div class="col-md-12 shadow-sm p-3 mb-5 bg-body rounded">
      <form [formGroup]="filterForm" (ngSubmit)="applyFilter()">
          <div class="row">
              <div class="col-md-4">
                  <div class="form-box">
                      <label class="form-check-label mb-2">Material Group</label>
                      <select formControlName="materialGroup" class="form-select">
                          <option value="">Select Material Group</option>
                          <option *ngFor="let group of materialGroups" [value]="group.id">
                              {{ group.group_name }}
                          </option>
                      </select>
                  </div>
              </div>
              <div class="col-md-4">
                  <div class="form-box">
                      <label class="form-check-label mb-2">Material Name</label>
                      <select formControlName="materialName" class="form-select">
                          <option value="">Select Material</option>
                          <option *ngFor="let material of material" [value]="material.id">
                              {{ material.material_name }}
                          </option>
                      </select>
                  </div>
              </div>
              <div class="col-md-4">
                  <div class="form-box">
                      <label class="form-check-label mb-2">Transaction Date</label>
                      <input type="date" formControlName="transactionDate" class="form-control px-0">
                  </div>
              </div>
          </div>
          <!-- <div class="text-center pt-3">
              <button type="submit" class="btn btn-primary">Apply Filters</button>
          </div> -->
      </form>
  </div>
        <div class="tablewrapper">
            <table class="table table-striped table-responsive">
                <thead>

                      <tr>
                        <th>ID</th>
                        <th>Material Group</th>
                        <th>Material Name</th>
                        <th>Quantity</th>
                        <th>Transaction Date</th>
                        <th>No. of order processed</th>
                        <th>Action</th>
                    </tr>

                </thead>
                <tbody>
                  <tr *ngFor="let item of outwardListData">
                    <td
                    (click)="updateOutward(item)"
                    style="color: blue; font-weight: 600; cursor: pointer"
                  >{{ item.id }}</td>
                    <td>{{ item.group_name }}</td>
                    <td>{{ item.material_name }}</td>
                    <td>{{ item.qty *-1 }}</td>
                    <td>{{ item.transition_date }}</td>
                    <td>{{ item.outward_orders }}</td>

                    <td style="cursor: pointer;" (click)="deleteOutward(item)"><i class="fa-solid fa-trash"></i></td>
                </tr>


                </tbody>
            </table>
            <!-- <div class="text-center py-2"> No Items Found </div> -->
        </div>
    </div>
