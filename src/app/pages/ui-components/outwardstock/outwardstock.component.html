<div class="d-flex flex-column flex-md-row container-fluid gap-3">
  <div
    class="col-md-3 col-xl-3 col-sm-12 col-12 bg-body card"
  >
    <form [formGroup]="outwardForm" class="p-3">
      <div class="align-items-center">
        <div class="row gy-3">
          <div class="col-xl-12 col-md-12 col-sm-12 col-12">
            <div class="form-box">
              <label class="form-check-label mb-2">Material Group</label>
              <select
                id="materialgroup"
                name="materialgroup"
                class="form-select"
                formControlName="materialgroup"
                (change)="getMaterial($event)"
              >
                <option value="">Select Material Group</option>

                <option *ngFor="let group of materialGroups" [value]="group.id">
                  {{ group.group_name }}
                </option>
              </select>
            </div>
          </div>

          <div class="col-xl-12 col-md-12 col-sm-12 col-12">
            <div class="form-box">
              <label class="form-check-label mb-2">Material Name</label>
              <select
                id="materialname"
                name="materialname"
                class="form-select"
                formControlName="materialname"
              >
                <option value="">Select Material</option>

                <option *ngFor="let group of material" [value]="group.id">
                  {{ group.material_name }}
                </option>
              </select>
            </div>
          </div>
          <div class="col-xl-12 col-lg-12 col-md-6 col-sm-12 col-12">
            <div class="form-box">
              <label class="form-check-label mb-2">Transaction Date</label>
              <input
                type="date"
                id="transdate"
                name="transdate"
                class="form-control px-0"
                formControlName="transdate"
              />
            </div>
          </div>
          <div class="col-xl-12 col-lg-12 col-md-6 col-sm-12 col-12">
            <div class="form-box">
              <label class="form-check-label mb-2">Quantity</label>
              <input
                type="text"
                id="quantity"
                name="quantity"
                class="form-control"
                formControlName="quantity"
                placeholder=" Enter Quantity"
              />
            </div>
          </div>
          <div class="col-xl-12 col-lg-12 col-md-6 col-sm-12 col-12"></div>
          <div class="form-box">
            <label class="form-check-label mb-2">No. of order processed</label>
            <input
              type="text"
              id="nooforders"
              name="nooforders"
              class="form-control"
              formControlName="nooforders"
              placeholder="Order Processed"
            />
          </div>
        </div>
      </div>

      <div class="submit-btn pt-3" *ngIf="!isUpdating">
        <button type="submit" class="btn btn-primary" (click)="outwardSubmit()">
          Submit
        </button>
      </div>

      <div class="submit-btn pt-4" *ngIf="isUpdating">
        <button type="button" class="btn btn-primary" (click)="onUpdate()">
          Update
        </button>
      </div>
    </form>
  </div>

  <div
    class="col-md-9 col-xl-9 col-sm-12 col-12 bg-body card"
  >
    <!-- <div class="col-md-12 col-xl-12 col-sm-12 col-12 shadow-sm p-3 mb-5 bg-body rounded"> -->
    <!-- <div class="col-md-12 col-sm-12 shadow-sm p-3 mb-5 bg-body rounded"> -->



      <form [formGroup]="filterForm" class="p-3">
        <div class="row">
          <div class="col-md-3">
            <div class="form-box">
              <label class="form-check-label mb-2">Material Group</label>
              <select formControlName="filtermaterialGroup" class="form-select"
              id="filtermaterialgroup"
              name="filtermaterialgroup"
              class="form-select"
              (change)="getMaterialFilter($event)"



              >
                <option value="">Select Material Group</option>
                <option *ngFor="let group of filterMaterialGroups" [value]="group.id">
                  {{ group.group_name }}
                </option>
              </select>
            </div>
          </div>





          <div class="col-md-3">
            <div class="form-box">
              <label class="form-check-label mb-2">Material Name</label>
              <select formControlName="item_id" class="form-select"
              id="materialname"
                name="materialname"

              >
                <option value="">Select Material</option>
                <option *ngFor="let material of filterName" [value]="material.id">
                  {{ material.material_name }}
                </option>
              </select>
            </div>
          </div>





          <!-- <div class="col-xl-6 col-md-6 col-sm-12 col-12">
            <div class="form-box">
              <label class="form-check-label mb-2">Material Name</label>
              <select
                id="materialname"
                name="materialname"
                class="form-select"
                formControlName="materialname"
                (change)="getMaterialName($event)"

              >
                <option value="">Select Material</option>

                <option *ngFor="let group of material" [value]="group.id">
                  {{ group.material_name+group.id }}
                </option>
              </select>
            </div>
          </div> -->

          <div class="col-md-3">
            <div class="form-box">
              <label class="form-check-label mb-2">Inward Date</label>
              <input
                type="date"
                formControlName="trans_date"
                class="form-control px-0"
              />
            </div>
          </div>

          <div class="col-md-3 d-flex align-items-center mt-4">
            <button type="submit" class="btn btn-primary mt-2" (click)="applyfilter('filteroutward')">Apply</button>
          </div>

        </div>


      </form>
    <!-- </div> -->
    <!-- </div> -->

    <div class="tablewrapper p-3">
      <table class="table table-striped table-responsive">
        <thead>
          <tr>
            <th>ID</th>
            <th>Material Group</th>
            <th>Material Name</th>
            <th>Quantity</th>
            <th>Transaction Date</th>
            <th>No. of order processed</th>
            <th>Action</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let item of outwardListData">
            <td
              (click)="updateOutward(item)"
              style="color: blue; font-weight: 600; cursor: pointer"
            >
              {{ item.id }}
            </td>
            <td>{{ item.group_name }}</td>
            <td>{{ item.material_name }}</td>
            <td>{{ item.qty * -1 }}</td>
            <td>{{ item.transition_date }}</td>
            <td>{{ item.outward_orders }}</td>

            <td style="cursor: pointer" (click)="deleteOutward(item)">
              <i class="fa-solid fa-trash"></i>
            </td>
          </tr>
        </tbody>
      </table>

      <div class="pagination-controls">
        <button
          class="btn btn-secondary"
          (click)="previousPage()"
          [disabled]="currentPage === 1"
        >
          Previous
        </button>
        <span class="mx-3">Page {{ currentPage }} of {{ totalPages }}</span>
        <button
          class="btn btn-secondary"
          (click)="nextPage()"
          [disabled]="currentPage >= totalPages"
        >
          Next
        </button>
      </div>
      <!-- <div class="text-center py-2"> No Items Found </div> -->
    </div>
  </div>
</div>
