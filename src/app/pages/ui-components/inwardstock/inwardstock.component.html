<div class="d-flex flex-column flex-md-row container-fluid gap-2">
    <div class="col-md-3 col-xl-3 col-sm-12 col-12 bg-body card">
        <form [formGroup]="inwardForm" class="px-2 py-3">
            <div class="align-items-center">
                <div class="row gy-3">


                    <div class="col-xl-12 col-md-12 col-sm-12 col-12">
                      <div class="form-box">
                        <label class="form-check-label mb-2">Material Group</label>
                        <select
                          id="materialgroup"
                          name="materialgroup"
                          class="form-select"
                          formControlName="materialgroup"
                          (change)="getMaterial($event)"
                          >
                          <option value="">Select Material Group</option>

                          <option *ngFor="let group of materialGroups" [value]="group.id">
                            {{ group.group_name }}
                          </option>
                        </select>
                      </div>
                    </div>



                    <div class="col-xl-12 col-md-12 col-sm-12 col-12">
                      <div class="form-box">
                        <label class="form-check-label mb-2">Material Name</label>
                        <select
                          id="materialname"
                          name="materialname"
                          class="form-select"
                          formControlName="materialname"
                          (change)="getMaterialName($event)"

                        >
                          <option value="">Select Material</option>

                          <option *ngFor="let group of material" [value]="group.id">
                            {{ group.material_name }}
                          </option>
                        </select>
                      </div>
                    </div>

                    <div class="col-xl-12 col-lg-12 col-md-6 col-sm-12 col-12">
                        <div class="form-box">
                            <label class="form-check-label mb-2">Invoice</label>
                            <input type="text" id="invoice" name="invoice" class="form-control"
                                formControlName="invoice" placeholder=" Enter Invoice">
                        </div>
                    </div>
                    <div class="col-xl-12 col-lg-12 col-md-6 col-sm-12 col-12">
                        <div class="form-box">
                            <label class="form-check-label mb-2">Quantity</label>
                            <input type="text" id="quantity" name="quantity" class="form-control"
                                formControlName="quantity" placeholder=" Enter Quantity">
                        </div>
                    </div>

                    <div class="col-xl-12 col-lg-12 col-md-6 col-sm-12 col-12">
                      <div class="form-box">
                          <label class="form-check-label mb-2">Transaction Date</label>
                          <input type="date" id="transdate" name="transdate" class="form-control"
                              formControlName="transdate">
                      </div>
                  </div>

                    <div class="col-xl-12 col-lg-12 col-md-6 col-sm-12 col-12">
                    <div class="form-box">
                        <label class="form-check-label mb-2">Invoice Date</label>
                        <input type="date" id="invoicedate" name="invoicedate" class="form-control"
                            formControlName="invoicedate">
                    </div>
                  </div>
                </div>
            </div>

            <div class="submit-btn pt-3" *ngIf="!isUpdating">
                <button type="submit" class="btn btn-primary" (click)="inwardSubmit()">Submit</button>
            </div>

          <div class="submit-btn pt-4" *ngIf="isUpdating">
            <button type="button" class="btn btn-primary" (click)="onUpdate()">Update</button>
        </div>

        </form>
    </div>
    <div class="col-md-9 col-xl-9 col-sm-12 col-12 bg-body card">



      <form [formGroup]="filterForm" class="px-2 py-3" >
        <div class="row">
          <div class="col-md-3">
            <div class="form-box">
              <label class="form-check-label mb-2">Material Group</label>
              <select formControlName="filtermaterialGroup" class="form-select"
              id="filtermaterialgroup"
              name="filtermaterialgroup"
              class="form-select"
              (change)="getMaterialFilter($event)"



              >
                <option value="">Select Material Group</option>
                <option *ngFor="let group of filterMaterialGroups" [value]="group.id">
                  {{ group.group_name }}
                </option>
              </select>
            </div>
          </div>





          <div class="col-md-3">
            <div class="form-box">
              <label class="form-check-label mb-2">Material Name</label>
              <select formControlName="item_id" class="form-select"
              id="materialname"
                name="materialname"

              >
                <option value="">Select Material</option>
                <option *ngFor="let material of filterMaterialName" [value]="material.id">
                  {{ material.material_name }}
                </option>
              </select>
            </div>
          </div>





          <!-- <div class="col-xl-6 col-md-6 col-sm-12 col-12">
            <div class="form-box">
              <label class="form-check-label mb-2">Material Name</label>
              <select
                id="materialname"
                name="materialname"
                class="form-select"
                formControlName="materialname"
                (change)="getMaterialName($event)"

              >
                <option value="">Select Material</option>

                <option *ngFor="let group of material" [value]="group.id">
                  {{ group.material_name+group.id }}
                </option>
              </select>
            </div>
          </div> -->

          <div class="col-md-3">
            <div class="form-box">
              <label class="form-check-label mb-2">Inward Date</label>
              <input
                type="date"
                formControlName="trans_date"
                class="form-control"
              />
            </div>
          </div>

          <div class="col-md-3 d-flex align-items-center mt-4">
            <button type="submit" class="btn btn-primary mt-2" (click)="applyfilter('filterinward')">Apply</button>
          </div>

        </div>


      </form>


        <div class="tablewrapper p-3">
            <table class="table table-striped table-responsive">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Material Group</th>
                        <th>Material Name</th>
                        <th>Invoice No.</th>
                        <th>Quantity</th>
                        <th>Invoice Date</th>
                        <th>Transaction Date</th>
                        <th>Action</th>
                    </tr>
                </thead>
                <tbody>
                    <tr *ngFor="let item of paginatedData">
                      <td
                      (click)="updateInward(item)"
                      style="color: blue; font-weight: 600; cursor: pointer"
                    >{{ item.id }}</td>
                        <td>{{ item.group_name }}</td>
                        <td>{{ item.material_name }}</td>
                        <td>{{ item.invoice_no }}</td>
                        <td>{{ item.qty }}</td>
                        <td>{{ item.invoice_date }}</td>
                        <td>{{ item.transition_date }}</td>
                        <td style="cursor: pointer;"(click)="deleteInward(item)"><i class="fa-solid fa-trash"></i></td>
                    </tr>

                </tbody>
            </table>

            <div class="pagination-controls">
              <button class="btn btn-secondary" (click)="previousPage()" [disabled]="currentPage === 1">Previous</button>
              <span class="mx-3">Page {{ currentPage }} of {{ totalPages }}</span>
              <button class="btn btn-secondary" (click)="nextPage()" [disabled]="currentPage >= totalPages">Next</button>
            </div>

        </div>
    </div>
