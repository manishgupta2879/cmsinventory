<div class="container-fluid p-0">
    <div class="d-flex flex-column flex-md-row justify-content-between  align-items-start align-items-md-center mt-0">
      <h1 _ngcontent-ng-c356681839="" class="fs-4 fw-bold mb-1 mb-md-0">Inventory</h1>
        <div class="col-12 col-md-2 col-xl-3 pe-md-4 shadow-sm p-3 mb-2 bg-body rounded">
                <div class="d-flex justify-content-between justify-content-md-center align-items-center gap-3">
                    <div class="">
                        <div class="form-box d-flex">
                            <input class="form-check-input me-2 " type="radio" name="inventory" id="inward"
                                [value]="'inward'" [(ngModel)]="selectedOption" (change)="onSelectionChange('inward')">
                            <label class="form-check-label fw-bold" for="inward">
                                Inward
                            </label>
                        </div>
                    </div>
                    <div class="">
                        <div class="form-box d-flex">
                            <input class="form-check-input me-2" type="radio" name="inventory" id="outward"
                                [value]="'outward'" [(ngModel)]="selectedOption"
                                (change)="onSelectionChange('outward')">
                            <label class="form-check-label fw-bold" for="outward">
                                Outward
                            </label>
                        </div>
                    </div>
                </div>

        </div>

    </div>
    <app-inwardstock *ngIf="selectedOption === 'inward'"></app-inwardstock>
    <app-outwardstock *ngIf="selectedOption === 'outward'"></app-outwardstock>

</div>
